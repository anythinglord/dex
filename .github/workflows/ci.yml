name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]

jobs:
  build-and-test:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        run: forge build

      - name: Test
        run: forge test -vvv

      - name: Coverage (≥ 95% lines)
        run: |
          forge coverage --report summary | tee coverage.txt
          PCT=$(awk -F'|' '/\| Total/{ if (match($3, /[0-9]+\.[0-9]+/)) print substr($3, RSTART, RLENGTH); exit }' coverage.txt)
          echo "Total line coverage: ${PCT}%"
          awk -v p="$PCT" 'BEGIN { exit !(p >= 95) }'

      - name: Gas report
        run: forge test --gas-report
