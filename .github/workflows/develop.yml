name: Changelog

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  changelog:
    name: Update CHANGELOG.md
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          curl -sSfL https://github.com/orhun/git-cliff/releases/download/v2.14.2/git-cliff-2.14.2-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /tmp
          sudo install /tmp/git-cliff-2.14.2-x86_64-unknown-linux-gnu/git-cliff /usr/local/bin/git-cliff

      - name: Generate changelog
        run: |
          TAG="v$(git cliff --bumped-version 2>/dev/null | tail -n 1)"
          git cliff --tag "$TAG" --output CHANGELOG.md
          echo "Rendered changelog for: ${TAG}"

      - name: Commit updated changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md is already up to date"
          else
            git commit -m "chore(release): update changelog [skip ci]"
            git push
          fi
